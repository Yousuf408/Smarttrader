<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeAlgo Pro · Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ================================================================ -->
    <!-- SIDEBAR -->
    <!-- ================================================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">📊<span class="sidebar-logo-text">TradeAlgoPro</span></div>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">◀</button>
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link active" data-page="home"><span class="sidebar-icon">🏠</span><span class="sidebar-label">Home</span></a>
            <a class="sidebar-link" data-page="screener"><span class="sidebar-icon">🔎</span><span class="sidebar-label">Screener</span></a>
            <a class="sidebar-link" data-page="portfolio"><span class="sidebar-icon">💼</span><span class="sidebar-label">Portfolio</span></a>
            <a class="sidebar-link" data-page="settings"><span class="sidebar-icon">🔧</span><span class="sidebar-label">Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-footer-btn" id="sidebarThemeToggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="sidebar-icon">🌙</span><span class="sidebar-label">Dark Mode</span>
            </button>
            <div class="sidebar-user" id="sidebarUser">
                <div class="sidebar-avatar" id="sidebarAvatar">U</div>
                <span class="sidebar-label" id="sidebarUserName">Welcome, User</span>
            </div>
            <button class="sidebar-footer-btn" onclick="logout()" aria-label="Logout" style="color:var(--color-danger);">
                <span class="sidebar-icon">🚪</span><span class="sidebar-label">Logout</span>
            </button>
        </div>
    </aside>

    <!-- ================================================================ -->
    <!-- TOP BAR (Compact) -->
    <!-- ================================================================ -->
    <header class="topbar" id="topbar">
        <div class="topbar-left">
            <span class="status"><span class="dot"></span> Live</span>
            <div class="topbar-indices" id="topbarIndices">
                <div class="idx-chip" id="idxChipNIFTY">
                    <span class="idx-name">NIFTY</span>
                    <span class="idx-val" id="idxValNIFTY">—</span>
                    <span class="idx-chg" id="idxChgNIFTY"></span>
                </div>
                <div class="idx-chip" id="idxChipBANKNIFTY">
                    <span class="idx-name">BANK NIFTY</span>
                    <span class="idx-val" id="idxValBANKNIFTY">—</span>
                    <span class="idx-chg" id="idxChgBANKNIFTY"></span>
                </div>
            </div>
        </div>
        <div class="topbar-right">
            <button class="notif-bell" id="notifBell" onclick="toggleNotifPanel()" aria-label="Notifications">🔔<span class="notif-badge" id="notifBadge" style="display:none;">0</span></button>
            <span class="balance" id="headerCapital">₹0</span>
            <div class="avatar-wrap" id="avatarWrap">
                <div class="avatar" id="headerAvatar">U</div>
                <div class="avatar-dropdown" id="avatarDropdown">
                    <div class="dropdown-user" id="dropdownUserInfo">
                        <span class="dropdown-name" id="dropdownUserName">User</span>
                        <span class="dropdown-email" id="dropdownUserEmail"></span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item" onclick="logout()">
                        <span>🚪</span> Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ================================================================ -->
    <!-- MAIN CONTENT (Dynamic Modular Container) -->
    <!-- ================================================================ -->
    <main class="container" id="mainContainer">
        <!-- Modular pages load dynamically here via main.js -->
    </main>

    <!-- ================================================================ -->
    <!-- NOTIFICATION PANEL -->
    <!-- ================================================================ -->
    <div class="notif-panel" id="notifPanel">
        <h4>🔔 Strategy Alerts</h4>
        <div id="notifList"><div class="notif-empty">No new alerts</div></div>
    </div>

    <!-- ================================================================ -->
    <!-- TOAST -->
    <!-- ================================================================ -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <button class="toast-close" type="button" aria-label="Dismiss notification" onclick="hideToast()">×</button>
        <div class="toast-title" id="toastTitle">✅ Success</div>
        <div id="toastMessage">Action completed</div>
    </div>

    <!-- ================================================================ -->
    <!-- BROKER MODAL — Connect / Dhan & Angel One popup for runtime creds -->
    <!-- ================================================================ -->
    <div id="brokerModalOverlay" class="modal-overlay" onclick="if(event.target===this) closeBrokerModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 id="brokerModalTitle">🔐 Connect to <span id="brokerModalName">Dhan</span></h2>

            <!-- DHAN FIELDS IN MODAL -->
            <div id="modalDhanFields">
                <div class="form-group">
                    <label>Client ID</label>
                    <input type="text" id="brokerClientId" placeholder="e.g. 1102302753" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label>TOTP Secret</label>
                    <input type="text" id="brokerTotpSecret" placeholder="Base-32 string from Dhan TOTP setup" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label>PIN <span style="opacity:0.5; font-weight:normal;">(optional but recommended for daily reset)</span></label>
                    <input type="password" id="brokerPin" placeholder="Your trading PIN" autocomplete="off" />
                </div>
            </div>

            <!-- ANGEL ONE FIELDS IN MODAL -->
            <div id="modalAngelFields" style="display:none;">
                <p class="broker-help-text" style="margin:0 0 8px 0; font-size:11px; opacity:0.6;">
                    💡 Paste all 4 lines at once into <strong>API Key</strong> — they auto-fill
                </p>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="text" id="brokerApiKey" placeholder="1st line — API Key" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label>Client ID</label>
                    <input type="text" id="brokerAngelClientId" placeholder="2nd line — Client ID" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="brokerPassword" placeholder="3rd line — Password" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label>TOTP Secret <span style="opacity:0.5; font-weight:normal;">(optional)</span></label>
                    <input type="text" id="brokerAngelTotp" placeholder="4th line — TOTP Secret" autocomplete="off" />
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeBrokerModal()">Cancel</button>
                <button class="btn btn-primary" id="brokerConnectBtn" onclick="submitBrokerCreds()">🔑 Connect</button>
            </div>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- CONFIRM ORDER MODAL — used by manual Place Order + Auto Buy -->
    <!-- ================================================================ -->
    <div id="confirmModalOverlay" class="confirm-modal-overlay">
        <div class="confirm-modal">
            <h3 id="confirmModalTitle">⚡ Confirm Buy</h3>
            <div class="confirm-modal-body">
                <div class="cm-row cm-symbol" id="confirmModalLine1">—</div>
                <div class="cm-row cm-math"   id="confirmModalLine2">—</div>
                <div class="cm-row cm-mode"   id="confirmModalLine3">—</div>
            </div>
            <div class="confirm-modal-actions">
                <button type="button" class="btn btn-secondary" onclick="_closeConfirmModal()">Cancel</button>
                <button type="button" class="btn btn-primary"   id="confirmModalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- JAVASCRIPT - LOAD IN ORDER -->
    <!-- ================================================================ -->
    <script src="auth/auth.js"></script>
    <script src="main.js"></script>
    <script src="home/home.js"></script>
    <script src="screener/screener.js"></script>
    <script src="portfolio/portfolio.js"></script>
    <script src="settings/settings.js"></script>
    <script>
        // Initialize app with modular page loader
        document.addEventListener('DOMContentLoaded', () => {
            navigateTo('home');
            console.log('🚀 TradeAlgo Pro · Modular Architecture Active');
        });
    </script>
</body>
</html>
