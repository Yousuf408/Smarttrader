<div id="page-backtest" class="page active">
    <h2 class="section-title">📊 Backtest</h2>
    <div class="panel-glass">
        <div class="panel-head">
            <h3>⚙️ Configuration</h3>
            <div class="screener-controls" style="flex-wrap:wrap;">
                <select id="backtestStrategy">
                    <option value="advanceorb">📈 Advance ORB</option>
                    <option value="smartmoney">💰 SmartMoney</option>
                    <option value="bigplayers">🏢 Big Players</option>
                </select>
                <input type="date" id="backtestStart" value="2025-01-01" />
                <input type="date" id="backtestEnd" value="2025-07-22" />
                <button class="btn btn-primary" onclick="runBacktest()">▶ Run Backtest</button>
            </div>
        </div>
        <div class="panel-body" id="backtestResults">
            <div class="chart-placeholder"><div><div class="big-icon">📊</div><p>Run a backtest to see results</p></div></div>
        </div>
    </div>
    <div class="panel-glass" style="margin-top:24px;">
        <div class="panel-head"><h3>📋 Results</h3></div>
        <div class="panel-body table-wrap" id="backtestMetrics"></div>
    </div>
</div>
