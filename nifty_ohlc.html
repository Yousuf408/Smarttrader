<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty 50 Top 10 — 5-Min OHLC (TradingView)</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2129; --border:#2d333b;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7;
    --up:#3fb950; --down:#f85149; --neutral:#d29922;
    --radius:12px; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:14px;line-height:1.4}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;
         margin-bottom:20px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
  h1 small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:4px}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .pill{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
        border:1px solid var(--border);background:var(--card)}
  .pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;
        vertical-align:middle}
  .pill.open .dot{background:var(--up);box-shadow:0 0 8px var(--up)}
  .pill.closed .dot{background:var(--down);box-shadow:0 0 8px var(--down)}
  .pill.premarket .dot{background:var(--neutral);box-shadow:0 0 8px var(--neutral)}
  .pill.open{border-color:rgba(63,185,80,.4)}
  .pill.closed{border-color:rgba(248,81,73,.4)}
  .pill.premarket{border-color:rgba(210,153,34,.4)}
  .meta{color:var(--muted);font-size:12.5px}
  .meta b{color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
         gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        padding:14px 16px;box-shadow:var(--shadow)}
  .stat .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .stat .val{font-size:15px;font-weight:700}
  .stat .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .stat .up{color:var(--up)} .stat .down{color:var(--down)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
           margin-bottom:12px}
  .btn{background:var(--accent);border:none;color:#fff;font-weight:600;cursor:pointer;
       padding:9px 16px;border-radius:8px;font-size:13px;transition:filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .tablecard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        overflow:auto;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;min-width:860px}
  thead th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-size:11px;
        text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:right;
        border-bottom:1px solid var(--border);white-space:nowrap}
  thead th:first-child,td.sym{text-align:left}
  tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);
        white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .sym .t{font-weight:700}.sym .s{color:var(--muted);font-size:11.5px;display:block;font-weight:500}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .chg{font-weight:700}
  .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;margin-left:6px;
       font-weight:700;vertical-align:middle}
  .tag.gain{background:rgba(63,185,80,.15);color:var(--up)}
  .tag.lose{background:rgba(248,81,73,.15);color:var(--down)}
  .tag.ema{background:rgba(47,129,247,.18);color:var(--accent)}
  .num.muted{color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;margin-top:16px;text-align:center;line-height:1.6}
  .foot a{color:var(--accent);text-decoration:none}
  .banner{display:none;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.4);
        color:var(--down);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
        border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:640px){h1{font-size:18px}.toolbar{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nifty 50 — Top 10 Movers
      <small>Intraday 5-Minute OHLC · TradingView Screener API</small>
    </h1>
    <div class="topbar">
      <span id="marketPill" class="pill"><span class="dot"></span><span id="marketLbl">—</span></span>
      <button class="btn ghost" id="refreshBtn" onclick="loadData(true)">↻ Refresh now</button>
    </div>
  </header>

  <div class="banner" id="errBanner"></div>

  <section class="stats" id="statsRow"></section>

  <div class="toolbar">
    <div class="meta">Last updated: <b id="lastUpdated">—</b></div>
    <button class="btn" id="exportBtn" onclick="exportCSV()">⬇ Export CSV</button>
  </div>

  <div class="tablecard" id="tableCard"></div>

  <div class="foot">
    Data source: <a href="https://github.com/deepentropy/tvscreener" target="_blank" rel="noopener">tvscreener</a> (unofficial TradingView Screener API).
    Auto-refresh every <b>30s</b> · Times in <b>IST</b>.
    OHLC/VWAP/EMA200 reflect the current 5-minute candle.
  </div>
</div>

<script>
const API = '/api/nifty/ohlc';
const want = new Set(['RELIANCE','TCS','HDFCBANK','INFY','ICICIBANK','HINDUNILVR','ITC','SBIN','BAJFINANCE','BHARTIARTL']);
let lastPayload = null;
let timer = null;

function el(id){ return document.getElementById(id); }
function fmt(n, d=2){
  if(n===null || n===undefined || Number.isNaN(n)) return '—';
  return Number(n).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtVol(n){
  if(!n) return '—';
  if(n>=1e7) return (n/1e7).toFixed(2)+' Cr';
  if(n>=1e5) return (n/1e5).toFixed(2)+' L';
  return n.toLocaleString('en-IN');
}
function signCls(v){ return v>0 ? 'up' : (v<0 ? 'down' : 'flat'); }

function renderStats(d){
  const s = d.stats;
  const box = el('statsRow');
  const gain = s.gainer, loss = s.loser;
  const ema = s.above_ema;
  box.innerHTML = `
    <div class="stat"><div class="lbl">Top Gainer</div>
      <div class="val up">${loss ? '' : ''}${gain ? gain.symbol : '—'}</div>
      <div class="sub up">${gain ? gain.change_pct.toFixed(2)+'% · ₹'+fmt(gain.price) : ''}</div></div>
    <div class="stat"><div class="lbl">Top Loser</div>
      <div class="val down">${loss ? loss.symbol : '—'}</div>
      <div class="sub down">${loss ? loss.change_pct.toFixed(2)+'% · ₹'+fmt(loss.price) : ''}</div></div>
    <div class="stat"><div class="lbl">Above 5m 200 EMA</div>
      <div class="val">${ema.count}<span style="color:var(--muted)"> / ${ema.total}</span></div>
      <div class="sub">${ema.symbols.join(', ') || 'None'}</div></div>`;
}

function renderTable(d){
  const rows = d.rows.slice().sort((a,b)=>b.change_pct-a.change_pct);
  const card = el('tableCard');
  if(!rows.length){
    card.innerHTML = `<div class="empty">No data returned. The market may be closed or TradingView is unavailable.</div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>Stock</th><th>LTP (₹)</th><th>5m Open</th><th>5m High</th><th>5m Low</th>
    <th>5m Close</th><th>VWAP</th><th>200 EMA</th><th>Volume</th><th>Δ %</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    const tags = [];
    if(r.symbol===d.stats.gainer?.symbol) tags.push('<span class="tag gain">GAIN</span>');
    if(r.symbol===d.stats.loser?.symbol) tags.push('<span class="tag lose">LOSE</span>');
    if(r.ema200 && r.price>r.ema200) tags.push('<span class="tag ema">>EMA</span>');
    const above = r.ema200 && r.price>r.ema200;
    html += `<tr>
      <td class="sym"><span class="t">${r.name}${tags.join('')}</span><span class="s">${r.symbol}</span></td>
      <td class="chg ${signCls(r.change_pct)}">${fmt(r.price)}</td>
      <td>${fmt(r.open)}</td><td class="up">${fmt(r.high)}</td><td class="down">${fmt(r.low)}</td>
      <td>${fmt(r.close)}</td>
      <td class="${r.price>=r.vwap?'up':'down'}">${fmt(r.vwap)}</td>
      <td class="${above?'up':'down'}">${fmt(r.ema200)}</td>
      <td class="muted">${fmtVol(r.volume)}</td>
      <td class="chg ${signCls(r.change_pct)}">${r.change_pct>0?'+':''}${r.change_pct.toFixed(2)}%</td>
    </tr>`;
  }
  card.innerHTML = html + '</tbody></table>';
}

function renderMarket(d){
  const m = d.market;
  const pill = el('marketPill');
  pill.className = 'pill ' + (m.label.toLowerCase().includes('open') ? 'open'
    : m.label.toLowerCase().includes('pre') ? 'premarket' : 'closed');
  el('marketLbl').textContent = m.label + ' — ' + m.note;
}

function exportCSV(){
  const d = lastPayload; if(!d || !d.rows) return;
  const head = ['Stock','Symbol','LTP','5m_Open','5m_High','5m_Low','5m_Close','VWAP','200_EMA','Volume','Change_Pct'];
  const lines = [head.join(',')];
  const order = d.rows.slice().sort((a,b)=>b.change_pct-a.change_pct);
  for(const r of order){
    lines.push([r.name,r.symbol,r.price,r.open,r.high,r.low,r.close,r.vwap,r.ema200,r.volume,r.change_pct].join(','));
  }
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nifty_top10_ohlc_'+d.as_of.replace(/[:T]/g,'-').slice(0,19)+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
}

function setLoading(on){
  el('refreshBtn').disabled = on;
  el('refreshBtn').innerHTML = on ? '<span class="spinner"></span>Fetching…' : '↻ Refresh now';
}

async function loadData(manual){
  if(manual) setLoading(true);
  el('errBanner').style.display = 'none';
  try{
    const resp = await fetch(API, {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    lastPayload = await resp.json();
    renderMarket(lastPayload);
    renderStats(lastPayload);
    renderTable(lastPayload);
    el('lastUpdated').textContent = lastPayload.as_of_display;
    if(lastPayload.error){
      el('errBanner').textContent = 'Partial data — TradingView error: '+lastPayload.error;
      el('errBanner').style.display = 'block';
    }
  }catch(err){
    el('lastUpdated').textContent = '—';
    el('errBanner').textContent = 'Failed to load data: '+err.message;
    el('errBanner').style.display = 'block';
  }finally{
    setLoading(false);
  }
}

function startAutoRefresh(){
  loadData(false);
  clearInterval(timer);
  timer = setInterval(()=>loadData(false), 30000);
}

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ loadData(true); startAutoRefresh(); }
});
startAutoRefresh();
</script>
</body>
</html>
