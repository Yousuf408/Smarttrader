<!-- ============================================================= -->
<!-- TESTING PAGE – Live Ticks & Nifty OHLC -->
<!-- ============================================================= -->
<div id="page-testing" class="page active">
    <div class="page-header" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px;">
            <h2>🧪 Testing & Analysis</h2>
            <div class="pill-nav" style="display:inline-flex; background:rgba(255,255,255,0.06); padding:3px; border-radius:8px; gap:4px;">
                <button type="button" class="btn btn-sm btn-primary" id="testingTabTicks" onclick="switchTestingTab('ticks')" style="padding:4px 12px; font-size:12px;">⚡ Live Ticks</button>
                <button type="button" class="btn btn-sm btn-outline" id="testingTabOhlc" onclick="switchTestingTab('ohlc')" style="padding:4px 12px; font-size:12px;">📊 Nifty OHLC (5m/15m)</button>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;" id="testingTicksMeta">
            <span id="testingCount" class="badge" style="font-size:13px;">0 stocks</span>
            <span id="testingUpdated" style="font-size:12px; opacity:0.6;">—</span>
        </div>
    </div>

    <!-- VIEW 1: LIVE TICKS -->
    <div id="testingViewTicks" class="panel-glass">
        <div class="panel-head">
            <h3>📊 Stock Watchlist</h3>
            <div style="display:flex; gap:8px;">
                <span style="font-size:11px; opacity:0.6;" id="testingConnectionStatus">🔴 Disconnected</span>
            </div>
        </div>
        <div class="panel-body" style="padding:0;">
            <div class="table-wrap">
                <table class="table-modern" id="testingTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Symbol</th>
                            <th>LTP (₹)</th>
                            <th>WS LTP</th>
                            <th>Change %</th>
                            <th>Open</th>
                            <th>Day High</th>
                            <th>Day Low</th>
                            <th>Volume</th>
                            <th>Gap %</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="testingTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="panel-footer" style="display:flex; justify-content:space-between; align-items:center;">
            <span>Auto-refreshes every 2 seconds</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" onclick="loadTestingData()" style="padding:6px 14px; font-size:12px;">🔄 Refresh Now</button>
            </div>
        </div>
    </div>

    <!-- VIEW 2: NIFTY OHLC -->
    <div id="testingViewOhlc" style="display:none; border:1px solid var(--border-color, #2d333b); border-radius:12px; overflow:hidden; background:var(--bg, #0d1117);">
        <iframe src="/testing/nifty_ohlc.html" id="testingNiftyOhlcFrame"
                style="width:100%; height:calc(100vh - 180px); min-height:580px; border:0; display:block;"
                title="Nifty OHLC"></iframe>
    </div>
</div>
