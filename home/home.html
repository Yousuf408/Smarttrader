<div id="page-home" class="page active">
    <div class="stats-row">
        <div class="stat-box"><div class="label">📊 Shortlisted</div><div class="value" id="s1">42</div><div class="sub green">↑ 6 new today</div></div>
        <div class="stat-box"><div class="label">⚡ Active Trades</div><div class="value" id="s2">18</div><div class="sub green">↑ 3 this hour</div></div>
        <div class="stat-box"><div class="label">🏆 Win Rate</div><div class="value" id="s3">68%</div><div class="sub green">↑ 4.2%</div></div>
        <div class="stat-box"><div class="label">💰 P&L Today</div><div class="value" style="color:var(--color-success);" id="s4">+₹4,280</div><div class="sub green">↑ +2.3%</div></div>
    </div>

    <div class="home-grid">
        <div>
            <div class="panel-glass">
                <div class="panel-head"><h3>⚡ Quick Actions</h3></div>
                <div class="panel-body action-buttons">
                    <button class="btn btn-primary" onclick="navigateTo('screener')">🔍 Open Screener</button>
                    <button class="btn btn-success" onclick="showToast('✅ Started','All strategies running')">▶ Start All</button>
                    <button class="btn btn-danger" onclick="showToast('⛔ Stopped','All trades stopped')">⏹ Stop All</button>
                </div>
            </div>
            <div class="panel-glass">
                <div class="panel-head"><h3>📈 Recent Trades</h3></div>
                <div class="panel-body table-wrap" id="recentTrades"></div>
            </div>
        </div>
        <div>
            <div class="panel-glass">
                <div class="panel-head"><h3>📊 Market Overview</h3></div>
                <div class="panel-body" id="marketOverview"></div>
            </div>
            <div class="panel-glass" style="background:var(--gradient-brand);color:#fff;border:none;">
                <div class="panel-head" style="border-bottom-color:rgba(255,255,255,0.15);">
                    <h3 style="color:#fff;">💡 Pro Tip</h3>
                </div>
                <div class="panel-body">
                    <p style="font-weight:400;opacity:0.9;font-size:14px;">Try different strategies from the Screener dropdown!</p>
                </div>
            </div>
        </div>
    </div>
</div>
